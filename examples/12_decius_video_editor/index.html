<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AffineUI - Decius video editor</title>
  <link rel="stylesheet" href="../frameworks/css/decius-css-0.5.2.bundle.min.css">
  <style>
body{margin:0;background:#14161c}
.app{height:100vh;background:var(--dcs-bg-app);display:flex;flex-direction:column;overflow:hidden}
.top{flex:1;min-height:0;display:flex;gap:1px;background:var(--dcs-line)}
.browser{flex:0 0 260px}.viewer{flex:1;min-width:0}.inspector{flex:0 0 300px}
.viewer-screen{height:100%;position:relative;background:radial-gradient(circle at 50% 38%,#30384b,#0e1015 76%);overflow:hidden}
.safe-frame{position:absolute;left:13%;right:13%;top:10%;bottom:10%;border:1px solid rgba(255,255,255,.18)}
.subject{position:absolute;left:38%;top:24%;width:210px;height:260px;background:linear-gradient(180deg,#42516c,#151922);border-radius:20px 20px 8px 8px;box-shadow:0 30px 70px rgba(0,0,0,.55)}
.playhead{position:absolute;top:0;bottom:0;left:348px;width:2px;background:var(--dcs-danger);box-shadow:0 0 8px rgba(239,107,107,.6)}
.timeline{height:258px;flex:0 0 258px;background:var(--dcs-bg);border-top:1px solid var(--dcs-line);display:flex;flex-direction:column}
.ruler{height:28px;position:relative;border-bottom:1px solid var(--dcs-line);font-family:var(--dcs-font-mono);font-size:10px;color:var(--dcs-text-mute)}
.ruler span{position:absolute;top:7px}
.tracks{position:relative;flex:1;overflow:hidden;background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:100% 44px}
.track-labels{position:absolute;left:0;top:0;bottom:0;width:92px;background:var(--dcs-surface-1);border-right:1px solid var(--dcs-line)}
.track-label{height:44px;display:flex;align-items:center;padding-left:10px;color:var(--dcs-text-mute);font-size:var(--dcs-fs-xs);text-transform:uppercase;letter-spacing:.08em}
.clip{position:absolute;height:30px;top:7px;border-radius:var(--dcs-r-2);padding:6px 8px;color:#fff;font-weight:500;overflow:hidden;white-space:nowrap;border:1px solid rgba(255,255,255,.18)}
.clip-selected{box-shadow:0 0 0 2px var(--dcs-accent),0 8px 20px rgba(0,0,0,.35)}
.clip-blue{background:#2f86ee}.clip-green{background:#2bb872}.clip-violet{background:#6f4eea}.clip-orange{background:#e07024}
.lane-1{transform:translateY(44px)}.lane-2{transform:translateY(88px)}.lane-3{transform:translateY(132px)}
.thumb{height:54px;background:var(--dcs-well);border:1px solid var(--dcs-line-soft);border-radius:var(--dcs-r-2);margin:8px;display:flex;align-items:center;justify-content:center;color:var(--dcs-text-mute)}
  </style>
</head>
<body class="dcs" data-dcs-density="compact" data-dcs-style="3d">
<div class="app">
  <div class="dcs-menubar"><div class="dcs-menubar__brand"><i class="di di-filmstrip"></i> Decius Cut</div><button class="dcs-menubar__item">File</button><button class="dcs-menubar__item">Timeline</button><button class="dcs-menubar__item">Color</button><div class="dcs-menubar__spacer"></div><div class="dcs-menubar__meta">00:01:42:18</div></div>
  <div class="top">
    <aside class="browser dcs-dockpane"><div class="dcs-dockpane__tabs"><button class="dcs-dockpane__tab" aria-selected="true"><i class="di di-folder-open"></i> Media</button></div><div class="dcs-dockpane__body"><div class="thumb">A001_C014</div><div class="thumb">B-roll harbor</div><div class="thumb">VO final</div><div class="thumb">Grade LUT</div></div></aside>
    <main class="viewer dcs-dockpane"><div class="dcs-dockpane__tabs"><button class="dcs-dockpane__tab" aria-selected="true"><i class="di di-view-render"></i> Program</button><div class="dcs-dockpane__tools"><button id="play" class="dcs-btn dcs-btn--primary"><i class="di di-play"></i> Play</button></div></div><div class="dcs-dockpane__body viewer-screen"><div class="safe-frame"></div><div class="subject"></div></div></main>
    <aside class="inspector dcs-dockpane"><div class="dcs-dockpane__tabs"><button class="dcs-dockpane__tab" aria-selected="true"><i class="di di-color-grade"></i> Grade</button></div><div class="dcs-dockpane__body" style="padding:12px">
      <div class="dcs-row"><span style="width:70px;color:var(--dcs-text-mute)">Exposure</span><div id="exposure" data-dcs-slider data-min="-2" data-max="2" data-value=".35" data-bipolar class="dcs-slider dcs-slider--bipolar"><div class="dcs-slider__track"><div class="dcs-slider__tick" style="left:25%"></div><div class="dcs-slider__tick" style="left:50%"></div><div class="dcs-slider__tick" style="left:75%"></div><div id="exposure__fill" class="dcs-slider__fill" style="left:50%;right:auto;width:8.75%"></div><div id="exposure__thumb" class="dcs-slider__thumb" style="left:58.75%"></div></div></div></div>
      <div class="dcs-row"><span style="width:70px;color:var(--dcs-text-mute)">Contrast</span><div id="contrast" data-dcs-slider data-min="0" data-max="1" data-value=".58" class="dcs-slider"><div class="dcs-slider__track"><div id="contrast__fill" class="dcs-slider__fill" style="width:58%"></div><div id="contrast__thumb" class="dcs-slider__thumb" style="left:58%"></div></div></div></div>
      <div style="display:flex;gap:18px;margin-top:18px">
        <div id="lift" data-dcs-knob data-min="0" data-max="1" data-value=".52" class="dcs-knob"><svg class="dcs-knob__ring" viewBox="0 0 24 24"><path d="M 4.58 4.58 A 10.5 10.5 0 1 1 19.42 19.42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-linecap="round"></path><path id="lift__arc" class="dcs-knob__arc" d="M 4.58 4.58 A 10.5 10.5 0 0 1 16.87 21.3" fill="none" stroke="var(--dcs-accent)" stroke-width="1.75" stroke-linecap="round"></path></svg><div class="dcs-knob__cap"></div><div id="lift__indicator" class="dcs-knob__indicator" style="--angle:5.4deg"></div><div class="dcs-knob__label">Lift</div><div id="lift__value" class="dcs-knob__value">0.52</div></div>
        <div id="gamma" data-dcs-knob data-min="0" data-max="1" data-value=".67" class="dcs-knob"><svg class="dcs-knob__ring" viewBox="0 0 24 24"><path d="M 4.58 4.58 A 10.5 10.5 0 1 1 19.42 19.42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-linecap="round"></path><path id="gamma__arc" class="dcs-knob__arc" d="M 4.58 4.58 A 10.5 10.5 0 1 1 21.42 14.9" fill="none" stroke="var(--dcs-accent)" stroke-width="1.75" stroke-linecap="round"></path></svg><div class="dcs-knob__cap"></div><div id="gamma__indicator" class="dcs-knob__indicator" style="--angle:45.9deg"></div><div class="dcs-knob__label">Gamma</div><div id="gamma__value" class="dcs-knob__value">0.67</div></div>
        <div id="gain" data-dcs-knob data-min="0" data-max="1" data-value=".41" class="dcs-knob"><svg class="dcs-knob__ring" viewBox="0 0 24 24"><path d="M 4.58 4.58 A 10.5 10.5 0 1 1 19.42 19.42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-linecap="round"></path><path id="gain__arc" class="dcs-knob__arc" d="M 4.58 4.58 A 10.5 10.5 0 0 1 10.07 22.28" fill="none" stroke="var(--dcs-accent)" stroke-width="1.75" stroke-linecap="round"></path></svg><div class="dcs-knob__cap"></div><div id="gain__indicator" class="dcs-knob__indicator" style="--angle:-24.3deg"></div><div class="dcs-knob__label">Gain</div><div id="gain__value" class="dcs-knob__value">0.41</div></div>
      </div>
    </div></aside>
  </div>
  <div class="timeline"><div class="ruler"><span style="left:104px">00:00</span><span style="left:284px">00:10</span><span style="left:464px">00:20</span><span style="left:644px">00:30</span><span style="left:824px">00:40</span></div><div class="tracks"><div class="track-labels"><div class="track-label">V2</div><div class="track-label">V1</div><div class="track-label">A1</div><div class="track-label">MIX</div></div><div style="position:absolute;left:92px;right:0;top:0;bottom:0"><div id="clip-0" class="clip clip-violet" style="left:20px;width:210px">Title pass</div><div id="clip-1" class="clip clip-blue clip-selected" style="left:82px;width:310px">A001_C014 hero</div><div id="clip-2" class="clip clip-green" style="left:410px;width:260px">Cutaway harbor</div><div class="lane-1"><div id="clip-3" class="clip clip-orange" style="left:50px;width:260px">Dialogue comp</div></div><div class="lane-2"><div id="clip-4" class="clip clip-green" style="left:70px;width:520px">Music stem</div></div><div class="playhead"></div></div></div></div>
</div>
<script src="../common/decius_demo_interactions.js"></script>
<script>
document.getElementById("play").addEventListener("click", ev => {
  const btn = ev.currentTarget;
  const playing = btn.textContent.includes("Play");
  btn.innerHTML = playing ? '<i class="di di-pause"></i> Pause' : '<i class="di di-play"></i> Play';
});
document.querySelectorAll(".clip[id]").forEach(clip => {
  clip.addEventListener("click", () => {
    document.querySelectorAll(".clip-selected").forEach(el => el.classList.remove("clip-selected"));
    clip.classList.add("clip-selected");
  });
});
</script>
</body>
</html>
