<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>AffineUI - Decius dark synth</title>
  <link rel="stylesheet" href="../frameworks/css/decius-css-0.4.1.bundle.min.css">
  <style>
body{margin:0;background:#101219}
.desk{min-height:100vh;background:radial-gradient(circle at 30% 0,#273044,#101219 64%);padding:22px;overflow:hidden}
.synth{height:820px;display:flex;flex-direction:column;gap:12px}
.topbar{display:flex;align-items:center;gap:12px}
.brand{font-size:24px;font-weight:700;letter-spacing:.08em;color:var(--dcs-text)}
.lcd{font-family:var(--dcs-font-mono);font-size:20px;color:#7dffb2;background:#101b17;border:1px solid #1f4f39;border-radius:var(--dcs-r-3);padding:8px 14px;box-shadow:inset 0 2px 8px rgba(0,0,0,.6),0 0 24px rgba(61,214,138,.14)}
.rack{flex:1;display:flex;gap:12px;min-height:0}
.module{background:rgba(32,35,43,.92);border:1px solid var(--dcs-line);border-radius:var(--dcs-r-3);padding:14px;box-shadow:var(--dcs-shadow-2)}
.module h2{margin:0 0 14px;font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--dcs-text-mute)}
.osc{flex:1}.filter{flex:1.15}.env{flex:.9}.mix{flex:.8}
.knobs{display:flex;gap:18px;flex-wrap:wrap}.slider-row{display:flex;align-items:center;gap:10px;margin:13px 0}.slider-row span{width:72px;color:var(--dcs-text-mute);font-size:var(--dcs-fs-xs);text-transform:uppercase}
.meters{display:flex;gap:8px;height:140px;align-items:end;padding:12px;background:var(--dcs-well);border:1px solid var(--dcs-line);border-radius:var(--dcs-r-2)}
.meter{flex:1;background:linear-gradient(180deg,var(--dcs-ok),var(--dcs-accent));border-radius:3px 3px 0 0;animation:pulse 900ms ease-in-out infinite alternate}
.m2{animation-delay:120ms}.m3{animation-delay:240ms}.m4{animation-delay:360ms}
@keyframes pulse{from{filter:brightness(.78);transform:scaleY(.84)}to{filter:brightness(1.15);transform:scaleY(1)}}
.keys{height:118px;display:flex;gap:3px}.key{flex:1;background:#e8e9ed;border:1px solid #9aa0aa;border-radius:0 0 6px 6px}.key.black{height:70px;background:#15171f;flex:.62;margin-left:-22px;margin-right:-22px;z-index:2}
  </style>
</head>
<body class="dcs" data-dcs-density="comfortable" data-dcs-accent="green">
<div class="desk"><div class="synth">
  <div class="topbar"><div class="brand">EMBER-7</div><div class="lcd">PATCH 1 / DENSE NATIVE LEAD</div><div style="flex:1"></div><button id="prev" class="dcs-btn dcs-btn--ghost"><i class="di di-chevron-left"></i> Prev</button><button id="next" class="dcs-btn dcs-btn--primary"><i class="di di-chevron-right"></i> Next</button></div>
  <div class="rack">
    <section class="module osc"><h2>Oscillators</h2><div class="knobs">
      <div id="shape" data-dcs-knob data-min="0" data-max="1" data-value=".66" class="dcs-knob" style="--knob-size:72px"><svg class="dcs-knob__ring" viewBox="0 0 24 24"><path d="M 4.58 4.58 A 10.5 10.5 0 1 1 19.42 19.42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-linecap="round"></path><path id="shape__arc" class="dcs-knob__arc" d="M 4.58 4.58 A 10.5 10.5 0 0 1 21.15 15.22" fill="none" stroke="var(--dcs-accent)" stroke-width="1.75" stroke-linecap="round"></path></svg><div class="dcs-knob__cap"></div><div id="shape__indicator" class="dcs-knob__indicator" style="--angle:43.2deg"></div><div class="dcs-knob__label">Shape</div><div id="shape__value" class="dcs-knob__value">0.66</div></div>
      <div id="detune" data-dcs-knob data-min="-1" data-max="1" data-value="-.18" data-bipolar class="dcs-knob" style="--knob-size:72px"><svg class="dcs-knob__ring" viewBox="0 0 24 24"><path d="M 4.58 4.58 A 10.5 10.5 0 1 1 19.42 19.42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-linecap="round"></path><path id="detune__arc" class="dcs-knob__arc" d="M 12 1.5 A 10.5 10.5 0 0 0 7.51 2.51" fill="none" stroke="var(--dcs-accent)" stroke-width="1.75" stroke-linecap="round"></path></svg><div class="dcs-knob__cap"></div><div id="detune__indicator" class="dcs-knob__indicator" style="--angle:-24.3deg"></div><div class="dcs-knob__label">Detune</div><div id="detune__value" class="dcs-knob__value">-0.18</div></div>
      <div id="fold" data-dcs-knob data-min="0" data-max="1" data-value=".42" class="dcs-knob" style="--knob-size:72px"><svg class="dcs-knob__ring" viewBox="0 0 24 24"><path d="M 4.58 4.58 A 10.5 10.5 0 1 1 19.42 19.42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-linecap="round"></path><path id="fold__arc" class="dcs-knob__arc" d="M 4.58 4.58 A 10.5 10.5 0 0 1 10.35 22.37" fill="none" stroke="var(--dcs-accent)" stroke-width="1.75" stroke-linecap="round"></path></svg><div class="dcs-knob__cap"></div><div id="fold__indicator" class="dcs-knob__indicator" style="--angle:-21.6deg"></div><div class="dcs-knob__label">Fold</div><div id="fold__value" class="dcs-knob__value">0.42</div></div>
    </div><div class="slider-row"><span>Sub</span><div id="sub" data-dcs-slider data-min="0" data-max="1" data-value=".54" class="dcs-slider"><div class="dcs-slider__track"><div class="dcs-slider__tick" style="left:25%"></div><div class="dcs-slider__tick" style="left:50%"></div><div class="dcs-slider__tick" style="left:75%"></div><div id="sub__fill" class="dcs-slider__fill" style="width:54%"></div><div id="sub__thumb" class="dcs-slider__thumb" style="left:54%"></div></div></div></div><div class="slider-row"><span>Phase</span><div id="phase" data-dcs-slider data-min="-1" data-max="1" data-value=".28" data-bipolar class="dcs-slider dcs-slider--bipolar"><div class="dcs-slider__track"><div class="dcs-slider__tick" style="left:25%"></div><div class="dcs-slider__tick" style="left:50%"></div><div class="dcs-slider__tick" style="left:75%"></div><div id="phase__fill" class="dcs-slider__fill" style="left:50%;right:auto;width:14%"></div><div id="phase__thumb" class="dcs-slider__thumb" style="left:64%"></div></div></div></div>
      <div id="sync" class="dcs-check"><div class="dcs-check__box"><i class="di di-check"></i></div><span>Hard sync</span></div>
    </section>
    <section class="module filter"><h2>Filter</h2><div class="knobs">
      <div id="cutoff" data-dcs-knob data-min="20" data-max="20000" data-value="9400" class="dcs-knob" style="--knob-size:86px"><svg class="dcs-knob__ring" viewBox="0 0 24 24"><path d="M 4.58 4.58 A 10.5 10.5 0 1 1 19.42 19.42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-linecap="round"></path><path id="cutoff__arc" class="dcs-knob__arc" d="M 4.58 4.58 A 10.5 10.5 0 0 1 11.67 22.49" fill="none" stroke="var(--dcs-accent)" stroke-width="1.75" stroke-linecap="round"></path></svg><div class="dcs-knob__cap"></div><div id="cutoff__indicator" class="dcs-knob__indicator" style="--angle:-8.2deg"></div><div class="dcs-knob__label">Cutoff</div><div id="cutoff__value" class="dcs-knob__value">9400</div></div>
      <div id="res" data-dcs-knob data-min="0" data-max="1" data-value=".72" class="dcs-knob" style="--knob-size:86px"><svg class="dcs-knob__ring" viewBox="0 0 24 24"><path d="M 4.58 4.58 A 10.5 10.5 0 1 1 19.42 19.42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-linecap="round"></path><path id="res__arc" class="dcs-knob__arc" d="M 4.58 4.58 A 10.5 10.5 0 1 1 22.48 12.33" fill="none" stroke="var(--dcs-accent)" stroke-width="1.75" stroke-linecap="round"></path></svg><div class="dcs-knob__cap"></div><div id="res__indicator" class="dcs-knob__indicator" style="--angle:59.4deg"></div><div class="dcs-knob__label">Res</div><div id="res__value" class="dcs-knob__value">0.72</div></div>
      <div id="env" data-dcs-knob data-min="-1" data-max="1" data-value=".15" data-bipolar class="dcs-knob" style="--knob-size:86px"><svg class="dcs-knob__ring" viewBox="0 0 24 24"><path d="M 4.58 4.58 A 10.5 10.5 0 1 1 19.42 19.42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-linecap="round"></path><path id="env__arc" class="dcs-knob__arc" d="M 12 1.5 A 10.5 10.5 0 0 1 15.51 2.1" fill="none" stroke="var(--dcs-accent)" stroke-width="1.75" stroke-linecap="round"></path></svg><div class="dcs-knob__cap"></div><div id="env__indicator" class="dcs-knob__indicator" style="--angle:20.25deg"></div><div class="dcs-knob__label">Env</div><div id="env__value" class="dcs-knob__value">0.15</div></div>
    </div><div class="slider-row"><span>Drive</span><div id="drive" data-dcs-slider data-min="0" data-max="1" data-value=".63" class="dcs-slider"><div class="dcs-slider__track"><div id="drive__fill" class="dcs-slider__fill" style="width:63%"></div><div id="drive__thumb" class="dcs-slider__thumb" style="left:63%"></div></div></div></div>
      <div class="dcs-row"><div id="armed" class="dcs-switch" aria-checked="true"></div><span>Voice armed</span></div>
    </section>
    <section class="module env"><h2>Envelope</h2><div class="knobs">
      <div id="atk" data-dcs-knob data-min="0" data-max="100" data-value="18" class="dcs-knob"><svg class="dcs-knob__ring" viewBox="0 0 24 24"><path d="M 4.58 4.58 A 10.5 10.5 0 1 1 19.42 19.42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-linecap="round"></path><path id="atk__arc" class="dcs-knob__arc" d="M 4.58 4.58 A 10.5 10.5 0 0 1 1.91 15.84" fill="none" stroke="var(--dcs-accent)" stroke-width="1.75" stroke-linecap="round"></path></svg><div class="dcs-knob__cap"></div><div id="atk__indicator" class="dcs-knob__indicator" style="--angle:-86.4deg"></div><div class="dcs-knob__label">Atk</div><div id="atk__value" class="dcs-knob__value">18</div></div>
      <div id="dec" data-dcs-knob data-min="0" data-max="100" data-value="42" class="dcs-knob"><svg class="dcs-knob__ring" viewBox="0 0 24 24"><path d="M 4.58 4.58 A 10.5 10.5 0 1 1 19.42 19.42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-linecap="round"></path><path id="dec__arc" class="dcs-knob__arc" d="M 4.58 4.58 A 10.5 10.5 0 0 1 10.35 22.37" fill="none" stroke="var(--dcs-accent)" stroke-width="1.75" stroke-linecap="round"></path></svg><div class="dcs-knob__cap"></div><div id="dec__indicator" class="dcs-knob__indicator" style="--angle:-21.6deg"></div><div class="dcs-knob__label">Dec</div><div id="dec__value" class="dcs-knob__value">42</div></div>
      <div id="rel" data-dcs-knob data-min="0" data-max="100" data-value="71" class="dcs-knob"><svg class="dcs-knob__ring" viewBox="0 0 24 24"><path d="M 4.58 4.58 A 10.5 10.5 0 1 1 19.42 19.42" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1.5" stroke-linecap="round"></path><path id="rel__arc" class="dcs-knob__arc" d="M 4.58 4.58 A 10.5 10.5 0 1 1 22.49 12" fill="none" stroke="var(--dcs-accent)" stroke-width="1.75" stroke-linecap="round"></path></svg><div class="dcs-knob__cap"></div><div id="rel__indicator" class="dcs-knob__indicator" style="--angle:56.7deg"></div><div class="dcs-knob__label">Rel</div><div id="rel__value" class="dcs-knob__value">71</div></div>
    </div><div style="display:flex;gap:16px;margin-top:18px"><div id="fader-a" data-dcs-fader data-min="0" data-max="1" data-value=".28" class="dcs-fader" style="--pos:72%"><div class="dcs-fader__track"></div><div class="dcs-fader__tick" style="top:25%"></div><div class="dcs-fader__tick" style="top:50%"></div><div class="dcs-fader__tick" style="top:75%"></div><div id="fader-a__thumb" class="dcs-fader__thumb"></div></div><div id="fader-d" data-dcs-fader data-min="0" data-max="1" data-value=".58" class="dcs-fader" style="--pos:42%"><div class="dcs-fader__track"></div><div class="dcs-fader__tick" style="top:25%"></div><div class="dcs-fader__tick" style="top:50%"></div><div class="dcs-fader__tick" style="top:75%"></div><div id="fader-d__thumb" class="dcs-fader__thumb"></div></div><div id="fader-s" data-dcs-fader data-min="0" data-max="1" data-value=".76" class="dcs-fader" style="--pos:24%"><div class="dcs-fader__track"></div><div class="dcs-fader__tick" style="top:25%"></div><div class="dcs-fader__tick" style="top:50%"></div><div class="dcs-fader__tick" style="top:75%"></div><div id="fader-s__thumb" class="dcs-fader__thumb"></div></div></div></section>
    <section class="module mix"><h2>Output</h2><div class="meters"><div class="meter" style="height:64%"></div><div class="meter m2" style="height:86%"></div><div class="meter m3" style="height:72%"></div><div class="meter m4" style="height:54%"></div></div><div style="margin-top:16px"><div id="output" data-dcs-slider data-min="0" data-max="1" data-value=".82" class="dcs-slider"><div class="dcs-slider__track"><div class="dcs-slider__tick" style="left:25%"></div><div class="dcs-slider__tick" style="left:50%"></div><div class="dcs-slider__tick" style="left:75%"></div><div id="output__fill" class="dcs-slider__fill" style="width:82%"></div><div id="output__thumb" class="dcs-slider__thumb" style="left:82%"></div></div></div></div></section>
  </div>
  <div class="keys"><div class="key"></div><div class="key black"></div><div class="key"></div><div class="key black"></div><div class="key"></div><div class="key"></div><div class="key black"></div><div class="key"></div><div class="key black"></div><div class="key"></div><div class="key black"></div><div class="key"></div></div>
</div></div>
<script src="../common/decius_demo_interactions.js"></script>
</body>
</html>
