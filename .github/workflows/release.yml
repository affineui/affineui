name: Release

# Tag-driven release for the non-Python artifacts. Python wheels have their
# own workflow (wheels.yml) and remain the source of truth for PyPI/TestPyPI.
#
# Tag → what happens
#   v1.2.3           final release: cargo publish → crates.io,
#                    dotnet nuget push → nuget.org, GitHub Release with
#                    the amalgamated .h/.cpp attached.
#   v1.2.3-rc.1      pre-release: same registries, but the pre-release
#                    suffix makes both crates.io and nuget.org hide the
#                    version from default installs (`cargo add` / `dotnet
#                    add` won't grab it without --version). Marked as
#                    "pre-release" on the GitHub Release too.
#
# Any suffix after the patch triplet (`-rc.1`, `-alpha.1`, `-beta.2`,
# even bare `-preview`) counts as a pre-release. Everything else is
# treated as a final.
#
# ────────────────────────────────────────────────────────────────────
# REQUIRED REPO SECRETS (owner-managed, add via repo Settings → Secrets):
#   CARGO_REGISTRY_TOKEN  — crates.io API token (Account Settings → API Tokens)
#   NUGET_API_KEY         — nuget.org API key (Account → API Keys)
# ────────────────────────────────────────────────────────────────────
# Python wheels: no secret needed. wheels.yml uses PyPI Trusted Publisher
# (OIDC) via the `pypi` / `testpypi` environments already configured on
# this repo. That workflow triggers on the same `v*` tags in parallel.
# ────────────────────────────────────────────────────────────────────

on:
  # Two entry points, both eventually resolve to a specific v* tag:
  #
  # 1. `push` on a v* tag — a user pushing a tag with their own
  #    credentials cascades here directly. Version comes from the ref.
  #
  # 2. `workflow_dispatch` with a `version` input — the sanctioned
  #    path when Cut release is what pushed the tag (GitHub Actions'
  #    GITHUB_TOKEN rule blocks tag pushes from cascading, but leaves
  #    workflow_dispatch as an explicit re-entry point), AND the path
  #    for a human retrying a failed publish from the Actions UI.
  #    The `version` input is required so a UI dispatch that defaults
  #    the ref to main (which parsing from `${GITHUB_REF_NAME}` alone
  #    could not handle) still works — the operator just types the
  #    version they want to (re)publish.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to (re)publish, bare (e.g. 0.4.0-beta.2). Must match an existing v* tag; each publishing job checks out that tag explicitly, so the "Use workflow from" branch does not matter.'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false   # never cancel a release mid-publish

# Least-privilege default. gh_release elevates to `contents: write` per-job
# to create the Release + upload assets. cargo/nuget/amalgamate need only
# checkout + registry token — read is enough.
permissions:
  contents: read

jobs:
  # ────── prepare ──────────────────────────────────────────────────
  # Extract the version + prerelease flag once so downstream jobs share
  # a single answer. Runs on a tiny runner and outputs the values via
  # GITHUB_OUTPUT, which the other jobs consume via `needs.prepare.outputs`.
  prepare:
    name: Determine version + prerelease flag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      core: ${{ steps.version.outputs.core }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # prepare doesn't push
      - id: version
        name: Resolve version
        # DISPATCH_VERSION goes through `env:` (not `${{ }}` string
        # interpolation) so a maliciously-crafted workflow_dispatch
        # input can't inject shell into the run block.
        # `set_version.py --check` validates the value and writes
        # `version=` / `is_prerelease=` / `core=` to $GITHUB_OUTPUT
        # using the SAME semver parser that the file-patching mode
        # uses — so we can't drift between "what we build" and
        # "what we classify". The parser correctly ignores build
        # metadata after `+` when deciding prerelease.
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$DISPATCH_VERSION"
          else
            # push event: ref is `refs/tags/v...`, name is `v...`.
            version="${GITHUB_REF_NAME#v}"
          fi
          python3 scripts/set_version.py --check "$version"

      - name: Require reviewed release notes
        # The drafts→cut flow is the only sanctioned path to a release —
        # every published version MUST correspond to a
        # docs/release-notes/v<CORE>.md that a human reviewed + merged.
        # Notes are keyed on CORE (MAJOR.MINOR.PATCH), so v1.2.4-rc.1,
        # v1.2.4-rc.2, and v1.2.4 all share the SAME docs/release-notes/
        # v1.2.4.md file — one story per release cycle, iterated through
        # its pre-releases and its eventual final.
        #
        # Seeding: pushing a `v*` tag with no matching notes file
        # trips this check and stops the workflow before amalgamate /
        # cargo / nuget / gh_release run. Ideal for the initial baseline
        # tag that shouldn't publish anywhere.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CORE: ${{ steps.version.outputs.core }}
        run: |
          set -euo pipefail
          notes="docs/release-notes/v${CORE}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::${notes} not found on this ref."
            echo "::error::Every release must be accompanied by reviewed release notes for its core version (${CORE})."
            echo "::error::Run the 'Draft release notes' workflow → review + merge the PR → dispatch 'Cut release' with version ${VERSION}."
            echo "::error::(If this tag is a SEED tag that intentionally shouldn't publish, this failure is the intended behavior — no action needed.)"
            exit 1
          fi
          echo "::notice::Found ${notes} — release will use it as the Release body."

  # ────── amalgamation ─────────────────────────────────────────────
  # Regenerate the two-file SDK against the tag's version and produce
  # a zip that ships as a GitHub Release asset. This is the single source
  # people fetch when they want the raw .cpp + .h without a package manager.
  amalgamate:
    name: Build amalgamated two-file SDK
    needs: prepare
    runs-on: macos-latest   # macOS keeps parity with the CI amalgamation check
    outputs:
      zip_name: ${{ steps.package.outputs.zip_name }}
    steps:
      # Check out THE TAG, not whatever ref the workflow was dispatched
      # against. Guarantees a UI retry publishes the exact same code no
      # matter which "Use workflow from" branch the operator picked.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
          persist-credentials: false   # amalgamate doesn't push
      - name: Install Ninja
        run: brew install ninja
      - name: Set version everywhere
        run: python3 scripts/set_version.py "${{ needs.prepare.outputs.version }}"
      - name: Configure + amalgamate
        run: |
          cmake --preset release
          cmake --build build/release --target amalgamate
      - id: package
        name: Package amalgamation
        run: |
          set -euo pipefail
          v="${{ needs.prepare.outputs.version }}"
          out="affineui-${v}"
          mkdir "$out"
          cp build/release/dist/affineui.h    "$out/"
          cp build/release/dist/affineui.cpp  "$out/"
          cp LICENSE "$out/" || true         # LICENSE may live at root
          cp README.md "$out/" 2>/dev/null || true
          zip -qr "${out}.zip" "$out"
          echo "zip_name=${out}.zip" >> "$GITHUB_OUTPUT"
          ls -la "${out}.zip"
      - name: Upload amalgamation artifact
        uses: actions/upload-artifact@v4
        with:
          name: amalgamation
          path: ${{ steps.package.outputs.zip_name }}
      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ZIP: ${{ steps.package.outputs.zip_name }}
        run: |
          server="${GITHUB_SERVER_URL:-https://github.com}"
          repo="${GITHUB_REPOSITORY}"
          {
            echo "### Amalgamated SDK zip"
            echo ""
            echo "- **Version:** \`${VERSION}\`"
            echo "- **Artifact:** \`${ZIP}\` — contains \`affineui.h\`, \`affineui.cpp\`, \`LICENSE\`, \`README.md\`"
            echo "- **Run artifact:** [\`amalgamation\`](${server}/${repo}/actions/runs/${GITHUB_RUN_ID})"
            echo "- Will be attached to the GitHub Release below."
          } >> "$GITHUB_STEP_SUMMARY"

  # ────── cargo (crates.io) ────────────────────────────────────────
  # Publish both crates in the workspace. affineui-sys must go first because
  # affineui depends on it — cargo publish is synchronous per crate, and
  # crates.io indexes new versions in a few seconds, so a small sleep between
  # them keeps the second `cargo publish` from failing to resolve the sys
  # crate we just uploaded.
  cargo:
    name: Publish crates.io
    needs: [prepare, amalgamate]
    runs-on: ubuntu-latest
    steps:
      # Check out the tag explicitly — a UI retry might dispatch from
      # any branch; we always want to publish the tagged code.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
          persist-credentials: false   # cargo publish uses CARGO_REGISTRY_TOKEN, not git
      - uses: dtolnay/rust-toolchain@stable
      - name: Set version everywhere
        run: python3 scripts/set_version.py "${{ needs.prepare.outputs.version }}"
      - name: Publish affineui-sys → crates.io
        working-directory: bindings/rust/affineui-sys
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --allow-dirty because set_version.py mutated Cargo.toml above and
        # we deliberately don't commit that mutation in CI.
        run: cargo publish --allow-dirty
      - name: Wait for crates.io index to catch up
        # 45s is comfortable — index updates typically land in under 10s
        # but crates.io occasionally throttles.
        run: sleep 45
      - name: Publish affineui → crates.io
        working-directory: bindings/rust/affineui
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty
      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### crates.io"
            echo ""
            echo "- [\`affineui-sys@${VERSION}\`](https://crates.io/crates/affineui-sys/${VERSION})"
            echo "- [\`affineui@${VERSION}\`](https://crates.io/crates/affineui/${VERSION})"
            echo ""
            echo "Install: \`cargo add affineui@${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Published affineui-sys@${VERSION} + affineui@${VERSION} to crates.io"

  # ────── native libraries for the NuGet package ─────────────────────
  # NuGet packages that ship native code carry a `runtimes/<rid>/native/`
  # payload per RID. We build affineui_c on all three OSes in parallel,
  # upload each as an artifact, and the `nuget` job below downloads all
  # three into build/ninja/ so the csproj bundles the full triple.
  native_libs:
    name: Build affineui_c (${{ matrix.rid }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            lib: affineui_c.dll
          - os: ubuntu-latest
            rid: linux-x64
            lib: libaffineui_c.so
          - os: macos-latest
            rid: osx-arm64
            lib: libaffineui_c.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
          persist-credentials: false
      # Windows only: put MSVC on PATH so cmake picks up cl.exe for the
      # Ninja generator. macOS + Ubuntu images already have their
      # compilers wired up.
      - uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'
      - name: Install Ninja
        shell: bash
        run: |
          if   [ "$RUNNER_OS" = "Linux"   ]; then sudo apt-get update && sudo apt-get install -y ninja-build
          elif [ "$RUNNER_OS" = "macOS"   ]; then brew install ninja
          elif [ "$RUNNER_OS" = "Windows" ]; then choco install ninja -y --no-progress
          fi
      - name: Configure + build affineui_c
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build/ninja -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DAFFINEUI_BUILD_C_SHARED=ON
          cmake --build build/ninja --target affineui_c
          ls build/ninja/${{ matrix.lib }}
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: affineui_c-${{ matrix.rid }}
          path: build/ninja/${{ matrix.lib }}
          if-no-files-found: error

  # ────── nuget (nuget.org) ────────────────────────────────────────
  nuget:
    name: Publish nuget.org
    needs: [prepare, amalgamate, native_libs]
    runs-on: ubuntu-latest
    steps:
      # Check out the tag explicitly — a UI retry might dispatch from
      # any branch; we always want to publish the tagged code.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
          persist-credentials: false   # nuget push uses NUGET_API_KEY, not git
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Pull in all three native libs from the matrix build. Each
      # artifact contains a single file; `merge-multiple: true`
      # flattens them into build/ninja/ (matching the csproj's
      # default AffineUINativeDir), so `dotnet pack` finds all three.
      - name: Download native libs
        uses: actions/download-artifact@v4
        with:
          path: build/ninja
          pattern: 'affineui_c-*'
          merge-multiple: true
      - name: Confirm all three natives are present
        run: |
          set -euo pipefail
          ls build/ninja/
          test -f build/ninja/affineui_c.dll        || { echo "::error::missing affineui_c.dll (win-x64)";     exit 1; }
          test -f build/ninja/libaffineui_c.so      || { echo "::error::missing libaffineui_c.so (linux-x64)"; exit 1; }
          test -f build/ninja/libaffineui_c.dylib   || { echo "::error::missing libaffineui_c.dylib (osx-arm64)"; exit 1; }
      - name: Set version everywhere
        run: python3 scripts/set_version.py "${{ needs.prepare.outputs.version }}"
      - name: Pack
        working-directory: bindings/csharp/AffineUI
        # csproj Version was patched above; -c Release enforces a clean build.
        run: dotnet pack -c Release -o ../artifacts
      - name: Push to nuget.org
        working-directory: bindings/csharp/artifacts
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        # --skip-duplicate lets a re-run of a failed publish succeed silently
        # instead of erroring on the already-uploaded package.
        run: |
          dotnet nuget push "*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "### NuGet"
            echo ""
            echo "- [\`AffineUI ${VERSION}\`](https://www.nuget.org/packages/AffineUI/${VERSION})"
            echo ""
            echo "Bundled RIDs: \`win-x64\`, \`linux-x64\`, \`osx-arm64\`"
            echo ""
            echo "Install: \`dotnet add package AffineUI --version ${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Published AffineUI ${VERSION} to nuget.org (win-x64 + linux-x64 + osx-arm64)"

  # ────── GitHub Release ───────────────────────────────────────────
  # Create the Release + attach the amalgamation zip. Marks the release
  # as pre-release when the tag has a suffix, so GitHub's "latest release"
  # link stays pointed at the last final version.
  gh_release:
    name: Publish GitHub Release
    # Runs after every prior job succeeds — default `needs` semantics
    # give us that without an explicit `if:`. (The old `always()` +
    # skipped-branch pattern existed to accommodate workflow_dispatch's
    # per-channel toggles; those are gone now.)
    needs: [prepare, amalgamate, cargo, nuget]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the Release
    steps:
      # Check out the tag explicitly so the release notes file we
      # attach is the version the tag actually shipped — a UI retry
      # against main would otherwise pick up any post-tag notes edits.
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.prepare.outputs.version }}
          persist-credentials: false
      - name: Download amalgamation artifact
        uses: actions/download-artifact@v4
        with:
          name: amalgamation

      # The core-versioned notes file is the tag's body (per prepare's
      # notes-file gate). Every tag in the same v${CORE} cycle uses the
      # same file — that's the point of the shared notes.
      - name: Locate release notes
        id: notes
        env:
          CORE: ${{ needs.prepare.outputs.core }}
        run: |
          set -euo pipefail
          f="docs/release-notes/v${CORE}.md"
          if [ -f "$f" ]; then
            echo "path=$f" >> "$GITHUB_OUTPUT"
            echo "auto=false" >> "$GITHUB_OUTPUT"
            echo "Using curated notes at $f"
          else
            # Shouldn't happen — prepare's notes-file gate should have
            # already failed the workflow. Kept as a safety net.
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "auto=true" >> "$GITHUB_OUTPUT"
            echo "::warning::${f} not found; falling back to auto-generated notes (should never happen — prepare should have gated)."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          # body_path wins over generate_release_notes when both are set;
          # empty body_path with generate_release_notes=true gives the
          # auto-generated notes (see the fallback above).
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.auto }}
          files: ${{ needs.amalgamate.outputs.zip_name }}
      - name: Summary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRE: ${{ needs.prepare.outputs.is_prerelease }}
          CORE: ${{ needs.prepare.outputs.core }}
          ZIP: ${{ needs.amalgamate.outputs.zip_name }}
        run: |
          server="${GITHUB_SERVER_URL:-https://github.com}"
          repo="${GITHUB_REPOSITORY}"
          tag="v${VERSION}"
          release_label="Release"
          [ "${IS_PRE}" = "true" ] && release_label="Pre-release"
          {
            echo "### GitHub ${release_label}"
            echo ""
            echo "- **Page:** [${tag}](${server}/${repo}/releases/tag/${tag})"
            echo "- **Body:** \`docs/release-notes/v${CORE}.md\`"
            echo "- **Asset:** \`${ZIP}\` — two-file C++ drop-in"
            echo "- **Pre-release flag:** \`${IS_PRE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Created GitHub ${release_label} ${tag} — ${server}/${repo}/releases/tag/${tag}"
