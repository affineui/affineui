name: Cut release

# Cuts a tag; release.yml + wheels.yml react to it and publish everywhere.
# The full process — and the reasoning — is docs/RELEASE_PROCESS.md.
#
# Two rules drive the design:
#
#   1. A FINAL RELEASE SHIPS AN RC'S COMMIT. It does not build something new.
#      `mode=release` requires a `source_tag` naming a tested pre-release of
#      the same version, and tags THAT COMMIT — even if main has moved on.
#      You ship what you tested.
#
#   2. THE VERSION LIVES IN THE REPO. You type the number; this workflow
#      verifies it matches the committed manifests and refuses otherwise. It
#      never invents or silently rewrites a version. Every version bug in the
#      0.4.x series came from a number being stamped in at build time from a
#      source nobody reviewed — most memorably a wheel whose `__version__` said
#      "0.0.1" while its pip metadata said "0.4.0".
#
# All the rules live in scripts/resolve_release.py, which is unit-testable and
# is the only thing here that reasons about versions.
#
# Why annotated tags: the tag message becomes the GitHub Release body, ships in
# every git clone, and gives us a record of what shipped.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, typed. e.g. 0.5.0 — no `v`, no suffix. The rc/alpha/beta counter is added automatically.'
        required: true
        type: string
      mode:
        description: 'Channel. rc/beta/alpha append an auto-incremented counter (0.5.0-rc.1, -rc.2 …). `release` publishes the plain number and REQUIRES a source_tag to promote.'
        required: true
        type: choice
        default: 'rc'
        options: ['rc', 'beta', 'alpha', 'release']
      source_tag:
        description: 'Commit to tag. Blank = HEAD of main. For mode=release this is REQUIRED and must be an RC of the same version (e.g. v0.5.0-rc.2) — the release ships THAT commit.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # One cut at a time per version+mode. cancel-in-progress: false so we never
  # abort a mid-flight tag push.
  group: cut-release-${{ inputs.version }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the tag
      actions:  write   # `gh workflow run` release.yml + wheels.yml after push
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # We DO push (the tag), so leave credentials persisted.

      # ───── resolve what we're actually publishing ─────
      # scripts/resolve_release.py is the entire rulebook, in one testable
      # place (see docs/RELEASE_PROCESS.md). It turns the three typed inputs
      # into (version, core, tag, source_ref) and REFUSES anything that would
      # produce a bad publish:
      #
      #   * mode=release without an RC of the same version to promote —
      #     a release ships a tested RC's commit, it never builds something new
      #   * a version that isn't greater than the last published release
      #   * a version typed with a suffix (the counter is automatic)
      #   * a tag that already exists
      #
      # Note `source_ref`: for mode=release this is the RC's COMMIT, not main's
      # HEAD. If main has moved on since that RC, those commits are simply not
      # in the release. That's the point — you ship what you tested.
      - id: resolve
        name: Resolve version, tag, and the commit to tag
        env:
          VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode }}
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          python3 scripts/resolve_release.py \
            --version "$VERSION" --mode "$MODE" --source-tag "$SOURCE_TAG"

      # ───── the version must already be in the repo ─────
      # We do NOT stamp versions at build time any more. The number is
      # committed and reviewed; this refuses to publish if what was typed
      # isn't what the manifests say. Checked against the SOURCE COMMIT,
      # since that's the tree that will actually be built and published.
      - name: Verify the manifests carry this version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          SOURCE_REF: ${{ steps.resolve.outputs.source_ref }}
        run: |
          set -euo pipefail
          git checkout --quiet "$SOURCE_REF"
          python3 scripts/set_version.py --verify "$VERSION"

      - name: Confirm the release notes exist
        env:
          CORE: ${{ steps.resolve.outputs.core }}
          SOURCE_REF: ${{ steps.resolve.outputs.source_ref }}
        run: |
          set -euo pipefail
          # Notes are keyed on core version — v0.5.0-rc.1, -rc.2 and the final
          # v0.5.0 all share docs/release-notes/v0.5.0.md. That file becomes the
          # tag message, and release.yml uses it as the GitHub Release body.
          # Read it from the SOURCE commit: that's what we're shipping.
          notes="docs/release-notes/v${CORE}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::${notes} does not exist at ${SOURCE_REF}."
            echo "::error::Every release needs notes for its core version (${CORE}); they are shared by every RC in the cycle. Add the file, merge it, then re-cut."
            exit 1
          fi

      # ───── what main has that this release does NOT ─────
      # Promoting an RC whose commit is behind main is expected and allowed.
      # But it must never be SILENT — surface exactly what's being left out so
      # an unintended omission is caught here rather than after publishing.
      - name: Report commits on main that are not in this release
        env:
          SOURCE_REF: ${{ steps.resolve.outputs.source_ref }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          behind=$(git rev-list --count "${SOURCE_REF}..origin/main" 2>/dev/null || echo 0)
          if [ "$behind" -gt 0 ]; then
            echo "::warning::${TAG} is being cut from a commit that is ${behind} commit(s) behind main. Those commits are NOT in this release:"
            git log --oneline "${SOURCE_REF}..origin/main" | sed 's/^/  /'
            {
              echo "### ⚠ ${behind} commit(s) on main are NOT in ${TAG}"
              echo
              echo '```'
              git log --oneline "${SOURCE_REF}..origin/main"
              echo '```'
              echo
              echo "This is expected when promoting an RC — the release ships the commit you tested."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Source commit is up to date with main."
          fi

      - id: push_tag
        name: Create + push annotated tag
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          CORE: ${{ steps.resolve.outputs.core }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SOURCE_REF: ${{ steps.resolve.outputs.source_ref }}
        # The tag goes on SOURCE_REF — the RC's commit for a promotion, HEAD
        # otherwise. `git tag -a -F` reads the message from the notes file, so
        # every tag in the cycle carries the same body, which release.yml then
        # reuses as the GitHub Release body.
        run: |
          set -euo pipefail
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name  'github-actions[bot]'
          git tag -a "$TAG" -F "docs/release-notes/v${CORE}.md" "$SOURCE_REF"
          git push origin "$TAG"
          echo "::notice::Pushed ${TAG} at ${SOURCE_REF} (notes: docs/release-notes/v${CORE}.md)."

      - name: Trigger release + wheels workflows
        # GitHub Actions rule: events triggered by the ephemeral
        # GITHUB_TOKEN — including the `push` from the previous step —
        # do NOT create new workflow runs. So the tag push alone would
        # NOT cascade release.yml or wheels.yml. `workflow_dispatch`
        # and `repository_dispatch` are the two documented exceptions:
        # we use the former to explicitly bootstrap both workflows
        # against the tag ref. They then parse `${GITHUB_REF_NAME}`
        # exactly like they would for a real push.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
        if: steps.push_tag.outcome == 'success'
        run: |
          set -euo pipefail
          tag="$TAG"
          # GitHub's ref database occasionally lags a beat behind the
          # tag push — dispatch immediately can 404 with "ref not found".
          # Bounded retry (5 attempts, 5s between) covers the lag without
          # unbounded waiting on a systemic outage.
          # `release.yml` takes a `version` input so a manual UI retry
          # (which defaults `--ref` to main) still works. We pass both:
          # `--ref "$tag"` selects the workflow file that shipped with
          # the tag, and `--field version=...` carries the version.
          # `wheels.yml` has its own `publish_target` input; we leave
          # it at the default (`none` → let the workflow's own
          # tag-vs-dispatch conditions decide routing based on the ref).
          dispatch() {
            local wf="$1" ; shift
            for attempt in 1 2 3 4 5; do
              if gh workflow run "$wf" --ref "$tag" "$@" 2>&1; then
                return 0
              fi
              echo "::warning::Dispatch of ${wf} against ${tag} failed (attempt ${attempt}/5); retrying in 5s…"
              sleep 5
            done
            echo "::error::Failed to dispatch ${wf} against ${tag} after 5 attempts."
            return 1
          }
          dispatch release.yml --field version="$VERSION"
          dispatch wheels.yml
          echo "::notice::Dispatched release.yml + wheels.yml against ${tag}."

      # ───── run summary ─────
      # Every important artifact this workflow produced, one click away.
      # Gated on push_tag.outcome so we don't render a "success" narrative
      # (with links to a tag that doesn't exist) when a preflight step or
      # the tag push itself failed.
      - name: Summary
        if: always()
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          CORE: ${{ steps.resolve.outputs.core }}
          TAG: ${{ steps.resolve.outputs.tag }}
          SOURCE_REF: ${{ steps.resolve.outputs.source_ref }}
          IS_PRE: ${{ steps.resolve.outputs.is_prerelease }}
          IN_VERSION: ${{ inputs.version }}
          MODE: ${{ inputs.mode }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          TAG_OUTCOME: ${{ steps.push_tag.outcome }}
        run: |
          set -euo pipefail
          if [ "${TAG_OUTCOME:-}" != "success" ]; then
            {
              echo "## ❌ Cut release failed"
              echo ""
              echo "| Field | Value |"
              echo "| --- | --- |"
              echo "| Requested | \`${IN_VERSION}\` (\`${MODE}\`) |"
              echo "| Source tag | \`${SOURCE_TAG:-<HEAD of main>}\` |"
              echo "| Resolved version | \`${VERSION:-<unresolved>}\` |"
              echo "| Tag push outcome | \`${TAG_OUTCOME:-<did not run>}\` |"
              echo ""
              echo "No tag was created. See the failing step — the usual causes are:"
              echo "- **\`mode=release\` with no \`source_tag\`** — a release must promote a tested RC of the same version."
              echo "- **The manifests don't carry this version** — the bump PR hasn't merged. Run \`scripts/set_version.py ${IN_VERSION}\`, review, merge."
              echo "- **Missing \`docs/release-notes/v${CORE:-X.Y.Z}.md\`.**"
              echo "- **The version isn't greater than the last release**, or the tag already exists."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="$TAG"
          server="${GITHUB_SERVER_URL:-https://github.com}"
          repo="${GITHUB_REPOSITORY}"
          short=$(git rev-parse --short "$SOURCE_REF")
          release_type="Release"
          [ "${IS_PRE:-false}" = "true" ] && release_type="Pre-release"
          {
            echo "## Cut ${release_type}: ${tag}"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Tag | [\`${tag}\`](${server}/${repo}/releases/tag/${tag}) |"
            echo "| Mode | \`${MODE}\` |"
            if [ -n "${SOURCE_TAG:-}" ]; then
              echo "| Promoted from | \`${SOURCE_TAG}\` |"
            fi
            echo "| Commit shipped | [\`${short}\`](${server}/${repo}/commit/${SOURCE_REF}) |"
            echo "| Core (notes-file key) | \`${CORE}\` |"
            echo "| Pre-release | \`${IS_PRE:-false}\` |"
            echo "| Notes body | [\`docs/release-notes/v${CORE}.md\`](${server}/${repo}/blob/main/docs/release-notes/v${CORE}.md) |"
            echo ""
            echo "**What happens next:** the tag push triggers \`release.yml\` and \`wheels.yml\`. Both react to the same \`v*\` push and publish to the appropriate registries:"
            echo ""
            if [ "${IS_PRE:-false}" = "true" ]; then
              echo "- **crates.io** — \`affineui@${VERSION}\` (hidden from default \`cargo add\` — needs \`--version ${VERSION}\`)"
              echo "- **nuget.org** — \`AffineUI ${VERSION}\` (hidden from default \`dotnet add\` — needs \`--version ${VERSION}\`)"
              echo "- **TestPyPI** — \`affineui==${VERSION}\` (pre-releases go here, not live PyPI)"
              echo "- **GitHub Release** — marked as pre-release"
            else
              echo "- **crates.io** — \`affineui@${VERSION}\`"
              echo "- **nuget.org** — \`AffineUI ${VERSION}\`"
              echo "- **PyPI** — \`affineui==${VERSION}\` (final releases only)"
              echo "- **GitHub Release** — marked as latest"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
