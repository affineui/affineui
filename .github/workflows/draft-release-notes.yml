name: Draft release notes

# Dispatch UI for humans cutting a release. Pick which segment to bump
# (patch / minor / major / none) and which channel (release / rc / beta /
# alpha); the workflow computes the next version, has Copilot CLI draft
# release notes from the commit log since the last tag, and opens a PR
# with the notes file at `docs/release-notes/v<VERSION>.md`. Reviewer
# edits the file inline in the PR. Once merged, dispatch `cut-release.yml`
# with the same version to actually create + push the annotated tag —
# release.yml + wheels.yml take it from there.
#
# Idempotent: dispatching again with the same (bump, mode) rebuilds
# the notes and force-pushes the PR branch. Any human edits already
# merged into main are preserved — only the still-open PR gets refreshed.
#
# ────────────────────────────────────────────────────────────────────
# REQUIRED SECRETS
#
#   COPILOT_TOKEN   Personal Access Token (classic or fine-grained) with
#                   the "Copilot Requests" permission. Copilot CLI runs
#                   against the account behind this token. Create at
#                   github.com/settings/tokens → generate → select
#                   Copilot Requests (fine-grained: "Copilot chat" scope).
#                   The default GITHUB_TOKEN doesn't have Copilot scope,
#                   which is why we pass an explicit PAT.
# ────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which core segment to bump. Pick `none` when just incrementing a pre-release counter (e.g. rc.1 → rc.2) or promoting a pre-release to a stable release.'
        required: true
        type: choice
        default: 'patch'
        options: ['none', 'patch', 'minor', 'major']
      mode:
        description: 'Release channel. `release` = plain triplet (v1.2.3). rc/beta/alpha = pre-release with auto-incremented counter (v1.2.3-rc.1, v1.2.3-rc.2 …).'
        required: true
        type: choice
        default: 'rc'
        options: ['release', 'rc', 'beta', 'alpha']

permissions:
  contents: read
  pull-requests: read   # elevated in the job below where needed

concurrency:
  # Only one active draft run per (bump,mode) combo — a re-dispatch
  # supersedes the previous. Prevents the "two parallel drafts fought
  # over the same PR branch" failure mode.
  group: draft-release-notes-${{ inputs.bump }}-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the release-notes branch
      pull-requests: write   # open / update the PR
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need every tag to find the previous release

      - name: Set up Node (for Copilot CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ───── determine last + next version ─────
      - id: last
        name: Determine last release tag
        # `git tag --sort=-v:refname` is lexical over semver — good enough
        # for our tag shape (v1.2.3, v1.2.3-rc.1 …). Refnames without a
        # semver-shaped `vX.Y.Z…` tail are ignored via the pattern.
        run: |
          set -euo pipefail
          last=$(git tag --list 'v*' --sort=-v:refname | head -1 || true)
          echo "last=$last" >> "$GITHUB_OUTPUT"
          echo "resolved last=${last:-<none>}"

      - id: next
        name: Compute next version
        env:
          LAST: ${{ steps.last.outputs.last }}
          BUMP: ${{ inputs.bump }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 scripts/next_version.py --last "$LAST" --bump "$BUMP" --mode "$MODE"

      # ───── draft the notes with Copilot CLI ─────
      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Collect commit log since last tag
        id: log
        env:
          LAST: ${{ steps.last.outputs.last }}
        run: |
          set -euo pipefail
          if [ -n "$LAST" ]; then
            range="${LAST}..HEAD"
          else
            range="HEAD"
          fi
          # `--no-merges` keeps squash-merge commits (which carry `(#N)`)
          # and drops the raw merge commits GitHub makes for "Rebase and
          # merge" fallbacks — those are always duplicates of a squashed
          # commit already in the range.
          git log "$range" --format='- %s' --no-merges > /tmp/commit_log.txt
          count=$(wc -l < /tmp/commit_log.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "commit count: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No commits between ${LAST:-<none>} and HEAD; nothing to draft."
            exit 1
          fi

      - name: Draft release notes with Copilot CLI
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          NEXT: ${{ steps.next.outputs.next }}
          LAST: ${{ steps.last.outputs.last }}
        run: |
          set -euo pipefail
          mkdir -p docs/release-notes
          notes_path="docs/release-notes/v${NEXT}.md"
          # Compose the prompt on disk (safer than a giant -p '…' arg on
          # the CLI). Copilot has file-write access via --allow-tool=write.
          prev_line="The previous release was ${LAST}."
          if [ -z "${LAST:-}" ]; then
            prev_line="This is the first release; there is no previous tag."
          fi
          cat > /tmp/prompt.md <<PROMPT
          Draft release notes for the AffineUI native UI library, version v${NEXT}.
          ${prev_line}

          Below is the list of git commit subjects merged since the previous
          release, one per line. Squash-merged PR numbers appear at the end
          of each subject in \`(#123)\` form.

          \`\`\`
          $(cat /tmp/commit_log.txt)
          \`\`\`

          Write the notes to \`${notes_path}\` as GitHub-flavored markdown,
          EXACTLY like this structure:

              Short 1-2 sentence overview paragraph.

              ### Fixes
              - Sentence describing the fix, tersely. (#123)

              ### Features
              - Sentence describing the feature. (#124)

              ### Refactors / internals
              - …

              ### CI / build
              - …

              ### Docs
              - …

          Rules:
          * Group by conventional-commit prefix on each subject (\`fix:\` →
            Fixes, \`feat:\` → Features, \`refactor:\` → Refactors / internals,
            \`ci:\` or \`build:\` → CI / build, \`docs:\` → Docs,
            \`test:\`/\`chore:\` fold into Refactors / internals).
          * If a section would be empty, OMIT the heading entirely.
          * Preserve the PR number \`(#N)\` if present in the subject; do
            not invent numbers.
          * One sentence per bullet. Trim scope prefixes like \`fix(app):\`
            down to just the human-facing summary.
          * Do not wrap the whole output in code fences.
          * Do not include a heading with the version number.

          Overwrite the file if it already exists. Exit when the file is
          written.
          PROMPT
          copilot -p "$(cat /tmp/prompt.md)" \
            --allow-tool=write \
            --allow-tool='shell(cat:*)' \
            --no-ask-user
          # Sanity check: Copilot might have written the file elsewhere or
          # not at all; fail loud if the expected path is empty.
          if [ ! -s "$notes_path" ]; then
            echo "::error::${notes_path} not written or empty after Copilot run."
            exit 1
          fi
          head -20 "$notes_path"

      # ───── open / refresh the PR ─────
      - name: Push branch + open/update PR
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT: ${{ steps.next.outputs.next }}
          LAST: ${{ steps.last.outputs.last }}
          BUMP: ${{ inputs.bump }}
          MODE: ${{ inputs.mode }}
        # Idempotent update — if the branch/PR already exist from a prior
        # dispatch, force-with-lease refreshes them; if not, we create
        # both. force-with-lease guards against overwriting human edits
        # that already made it to the branch (they'd be detected as a
        # non-fast-forward and cause the push to fail loud).
        run: |
          set -euo pipefail
          branch="release-notes/v${NEXT}"
          notes_path="docs/release-notes/v${NEXT}.md"
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git config user.name  'github-actions[bot]'

          # Create the branch off main (fresh each run); if it exists on
          # origin, we rebase on top so old CI-drafted commits are dropped
          # but merged human edits to unrelated files persist.
          git fetch origin main
          git checkout -B "$branch" origin/main
          # Bring the notes file we just wrote (Copilot wrote in the
          # workspace root, which is on branch main-tip; the checkout
          # above kept it in the worktree).
          git add "$notes_path"
          if git diff --cached --quiet; then
            echo "::warning::No change to $notes_path — skipping push."
            exit 0
          fi
          git commit -m "docs: draft AI release notes for v${NEXT} (${BUMP}/${MODE})"
          git push --force-with-lease origin "$branch"

          if gh pr view "$branch" --json number 2>/dev/null >/dev/null; then
            echo "PR for $branch already exists — refreshed with new commit."
            gh pr comment "$branch" --body \
              "🔄 Release notes refreshed (bump=${BUMP}, mode=${MODE}). Latest commit head: \`$(git rev-parse --short HEAD)\`."
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Release notes for v${NEXT}" \
              --body "$(printf '%s\n' \
                "**AI-drafted release notes for v${NEXT}**" \
                "" \
                "- Bump: \`${BUMP}\`" \
                "- Mode: \`${MODE}\`" \
                "- Previous tag: \`${LAST:-<none>}\`" \
                "" \
                "Review + edit \`${notes_path}\` inline in this PR. When you're happy, merge this PR, then dispatch \`Cut release\` with version \`${NEXT}\` to create + push the annotated tag. The existing \`release.yml\` + \`wheels.yml\` workflows will pick up the tag push and publish to crates.io / nuget.org / PyPI / GitHub Release." \
                "" \
                "_Re-dispatching \`Draft release notes\` with the same (bump, mode) will refresh this PR in place._" \
              )"
          fi
