name: Wheels

# Build (and on tag, publish) the affineui Python wheel across Linux / macOS /
# Windows. Backed by `cibuildwheel`, which:
#   - Linux:   builds inside a manylinux_2_28 (AlmaLinux 9) container per Python
#              version, so the wheel ships against an old glibc and works on
#              most distros without a system Python rebuild.
#   - macOS:   builds a `universal2` wheel (single fat binary that runs natively
#              on both Intel and Apple Silicon).
#   - Windows: builds AMD64 wheels against Visual Studio.
#
# Publishing uses PyPI's Trusted Publisher (OIDC) flow — no API tokens in
# repo secrets. You configure the publisher once in the PyPI project's
# "Publishing" settings (owner = affineui, repo = affineui, workflow =
# wheels.yml, environment = pypi). After that, pushing a `v*.*.*` tag
# triggers a build + publish; PRs and main-branch pushes only build (no
# publish) so wheels stay smoke-tested on every change.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Where to publish (none = build + smoke-test only)'
        required: false
        default: 'none'
        type: choice
        options: ['none', 'testpypi', 'pypi']

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast preflight: on a tag push, refuse to run the (expensive) wheel +
  # sdist builds if there's no reviewed docs/release-notes/v<CORE>.md
  # merged on the ref. Fails within seconds instead of after ~10-15 min
  # of cibuildwheel across three OSes. On non-tag events (PRs, main
  # pushes) this passes through as a no-op so smoke builds still run.
  check_notes:
    name: Require reviewed release notes (tag pushes only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify notes file for tag pushes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Notes are keyed on CORE (MAJOR.MINOR.PATCH) — same file
          # covers every -rc/-beta/-alpha in the cycle and the final.
          core="${version%%-*}"
          core="${core%%+*}"
          notes="docs/release-notes/v${core}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::${notes} not found on this ref — refusing to publish."
            echo "::error::Notes are shared across every version in the v${core} cycle. Run 'Draft release notes' → review + merge → dispatch 'Cut release' with version ${version}."
            exit 1
          fi
          echo "::notice::Found ${notes} — build + publish will proceed."
      - name: Non-tag event — skip
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: echo "Non-tag event — nothing to check; smoke builds proceed."

  build_wheels:
    name: Wheels (${{ matrix.os }})
    needs: check_notes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for cibuildwheel host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # On a tag push, patch every version-holding file (pyproject.toml
      # included) to match the tag before cibuildwheel reads it. On PRs
      # and main-branch pushes the current pyproject.toml version stands
      # (used for smoke-only builds — not published anywhere).
      # `shell: bash` forced because ${VAR#prefix} is a bash parameter
      # expansion that PowerShell (Windows default shell) doesn't parse.
      - name: Patch version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python3 scripts/set_version.py "${GITHUB_REF_NAME#v}"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        with:
          package-dir: bindings/python
          output-dir: wheelhouse
        env:
          # CPython 3.9 → 3.13. PyPy is skipped — pybind11 ABI on PyPy is
          # not part of our smoke matrix today; can re-enable later.
          CIBW_BUILD: 'cp39-* cp310-* cp311-* cp312-* cp313-*'
          CIBW_SKIP: 'pp* *-musllinux_* *-win32 *-manylinux_i686'

          # Linux: opt into manylinux_2_28 (AlmaLinux 9 + gcc-toolset-13).
          # cibuildwheel's default is still manylinux2014 (CentOS 7 + GCC 10),
          # whose libstdc++ doesn't ship <source_location> — a C++20 header
          # the code uses via affineui/view.h.
          CIBW_MANYLINUX_X86_64_IMAGE: 'manylinux_2_28'

          # macOS: single universal2 wheel covers Intel + Apple Silicon.
          CIBW_ARCHS_MACOS: 'universal2'
          # macOS deployment target: 11.0 lines up with Apple Silicon shipping.
          MACOSX_DEPLOYMENT_TARGET: '11.0'

          # Linux: x86_64 only for the first cut. aarch64 needs QEMU and
          # 5–10× the runner time; revisit once we have demand.
          CIBW_ARCHS_LINUX: 'x86_64'

          # Windows: AMD64 only.
          CIBW_ARCHS_WINDOWS: 'AMD64'

          # Linux container deps: sokol_app needs X11/GL/ALSA headers. The
          # manylinux_2_28 default GCC handles C++20 (our baseline) cleanly.
          # xvfb is for the headless smoke test (sokol_app expects an X
          # connection even when we never call sapp_run).
          CIBW_BEFORE_ALL_LINUX: |
            yum install -y \
              libX11-devel libXi-devel libXcursor-devel \
              libxkbcommon-devel mesa-libGL-devel alsa-lib-devel \
              ninja-build xorg-x11-server-Xvfb

          # CMake 4 removed compat with cmake_minimum_required < 3.5; some
          # vendored CMake projects (doctest) still ship those. Belt-and-
          # braces — CMakeLists.txt also sets this variable.
          CIBW_ENVIRONMENT: 'CMAKE_POLICY_VERSION_MINIMUM=3.5'

          # The Python smoke tests are headless (no `sapp_run`), but sokol_app
          # on Linux still expects an X connection during construction; xvfb
          # gives it one inside the manylinux container.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: 'pytest -x {package}/tests'
          CIBW_TEST_COMMAND_LINUX: 'xvfb-run -a pytest -x {package}/tests'

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    needs: check_notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch version to tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/set_version.py "${GITHUB_REF_NAME#v}"
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir sdist bindings/python
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: sdist/*.tar.gz

  publish_testpypi:
    name: Publish to TestPyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # TestPyPI is now the RELEASE path for pre-release tags AND the dry-run
    # path for manual dispatch. Pre-release tags (v1.2.3-rc.1, v1.2.3-alpha.2,
    # etc.) publish here so they can be `pip install`ed with the TestPyPI
    # index URL before promoting to real PyPI via a bare-triplet tag.
    if: |
      (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'testpypi')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/affineui
    permissions:
      id-token: write  # OIDC for Trusted Publisher
    steps:
      # Notes-file check happens in the check_notes preflight job at
      # the top of the workflow (transitively via build_wheels /
      # build_sdist), so by the time we get here the presence of
      # docs/release-notes/v<CORE>.md is already guaranteed.
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'wheels-*'
          merge-multiple: true
      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Summary
        run: |
          set -euo pipefail
          # `find` returns exit 0 even when no matches, so it stays safe
          # under `pipefail`. `ls glob | ...` would abort the pipeline.
          sdist_path=$(find dist -maxdepth 1 -name 'affineui-*.tar.gz' -type f 2>/dev/null | head -1 || true)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Version comes from the sdist filename since no tag drives this.
            version=$(basename "${sdist_path:-}" | sed -E 's|^affineui-(.*)\.tar\.gz$|\1|')
          else
            # Tag events: strip leading v. PEP-440 normalization (v1.0.0-rc.1
            # → 1.0.0rc1) happens inside the sdist filename; expose both.
            version="${GITHUB_REF_NAME#v}"
          fi
          wheels=$(find dist -maxdepth 1 -name '*.whl' -type f 2>/dev/null | wc -l | tr -d ' ')
          sdist=$(basename "${sdist_path:-<none>}")
          {
            echo "## Published to TestPyPI"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${version:-<unknown>}\` |"
            echo "| Project page | [test.pypi.org/project/affineui/${version}/](https://test.pypi.org/project/affineui/${version}/) |"
            echo "| Wheels uploaded | ${wheels} |"
            echo "| sdist | \`${sdist:-<none>}\` |"
            echo ""
            echo '**Install (TestPyPI needs a dual-index so runtime deps resolve from real PyPI):**'
            echo ''
            echo '```bash'
            echo "pip install \\"
            echo "  --index-url https://test.pypi.org/simple/ \\"
            echo "  --extra-index-url https://pypi.org/simple/ \\"
            echo "  affineui==${version}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Published affineui ${version} to TestPyPI — https://test.pypi.org/project/affineui/${version}/"

  publish_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Live PyPI is reserved for FINAL tags — bare `v1.2.3` triplets with
    # no pre-release suffix. Pre-release tags (`v1.2.3-rc.1` etc.) route
    # to TestPyPI above so they can be validated before promotion.
    # Manual dispatch with publish_target=pypi still works as an escape
    # hatch for re-publishing.
    if: |
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/p/affineui
    permissions:
      id-token: write  # OIDC for Trusted Publisher
    steps:
      # Notes-file check is already enforced by check_notes at the top
      # of the workflow — no per-publish-job repetition needed.
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'wheels-*'
          merge-multiple: true
      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Summary
        run: |
          set -euo pipefail
          # `find` returns exit 0 even when no matches, so it stays safe
          # under `pipefail`. `ls glob | ...` would abort the pipeline.
          sdist_path=$(find dist -maxdepth 1 -name 'affineui-*.tar.gz' -type f 2>/dev/null | head -1 || true)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version=$(basename "${sdist_path:-}" | sed -E 's|^affineui-(.*)\.tar\.gz$|\1|')
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          wheels=$(find dist -maxdepth 1 -name '*.whl' -type f 2>/dev/null | wc -l | tr -d ' ')
          sdist=$(basename "${sdist_path:-<none>}")
          {
            echo "## Published to PyPI"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${version:-<unknown>}\` |"
            echo "| Project page | [pypi.org/project/affineui/${version}/](https://pypi.org/project/affineui/${version}/) |"
            echo "| Wheels uploaded | ${wheels} |"
            echo "| sdist | \`${sdist:-<none>}\` |"
            echo ""
            echo "**Install:** \`pip install affineui==${version}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Published affineui ${version} to PyPI — https://pypi.org/project/affineui/${version}/"
