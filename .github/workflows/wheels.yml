name: Wheels

# Build (and on tag, publish) the affineui Python wheel across Linux / macOS /
# Windows. Backed by `cibuildwheel`, which:
#   - Linux:   builds inside a manylinux_2_28 (AlmaLinux 9) container per Python
#              version, so the wheel ships against an old glibc and works on
#              most distros without a system Python rebuild.
#   - macOS:   builds a `universal2` wheel (single fat binary that runs natively
#              on both Intel and Apple Silicon).
#   - Windows: builds AMD64 wheels against Visual Studio.
#
# Publishing uses PyPI's Trusted Publisher (OIDC) flow — no API tokens in
# repo secrets. You configure the publisher once in the PyPI project's
# "Publishing" settings (owner = benjcooley, repo = affineui, workflow =
# wheels.yml, environment = pypi). After that, pushing a `v*.*.*` tag
# triggers a build + publish; PRs and main-branch pushes only build (no
# publish) so wheels stay smoke-tested on every change.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_target:
        description: 'Where to publish (none = build + smoke-test only)'
        required: false
        default: 'none'
        type: choice
        options: ['none', 'testpypi', 'pypi']

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python (for cibuildwheel host)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        with:
          package-dir: bindings/python
          output-dir: wheelhouse
        env:
          # CPython 3.9 → 3.13. PyPy is skipped — pybind11 ABI on PyPy is
          # not part of our smoke matrix today; can re-enable later.
          CIBW_BUILD: 'cp39-* cp310-* cp311-* cp312-* cp313-*'
          CIBW_SKIP: 'pp* *-musllinux_* *-win32 *-manylinux_i686'

          # Linux: opt into manylinux_2_28 (AlmaLinux 9 + gcc-toolset-13).
          # cibuildwheel's default is still manylinux2014 (CentOS 7 + GCC 10),
          # whose libstdc++ doesn't ship <source_location> — a C++20 header
          # the code uses via affineui/view.h.
          CIBW_MANYLINUX_X86_64_IMAGE: 'manylinux_2_28'

          # macOS: single universal2 wheel covers Intel + Apple Silicon.
          CIBW_ARCHS_MACOS: 'universal2'
          # macOS deployment target: 11.0 lines up with Apple Silicon shipping.
          MACOSX_DEPLOYMENT_TARGET: '11.0'

          # Linux: x86_64 only for the first cut. aarch64 needs QEMU and
          # 5–10× the runner time; revisit once we have demand.
          CIBW_ARCHS_LINUX: 'x86_64'

          # Windows: AMD64 only.
          CIBW_ARCHS_WINDOWS: 'AMD64'

          # Linux container deps: sokol_app needs X11/GL/ALSA headers. The
          # manylinux_2_28 default GCC handles C++20 (our baseline) cleanly.
          # xvfb is for the headless smoke test (sokol_app expects an X
          # connection even when we never call sapp_run).
          CIBW_BEFORE_ALL_LINUX: |
            yum install -y \
              libX11-devel libXi-devel libXcursor-devel \
              libxkbcommon-devel mesa-libGL-devel alsa-lib-devel \
              ninja-build xorg-x11-server-Xvfb

          # CMake 4 removed compat with cmake_minimum_required < 3.5; some
          # vendored CMake projects (doctest) still ship those. Belt-and-
          # braces — CMakeLists.txt also sets this variable.
          CIBW_ENVIRONMENT: 'CMAKE_POLICY_VERSION_MINIMUM=3.5'

          # The Python smoke tests are headless (no `sapp_run`), but sokol_app
          # on Linux still expects an X connection during construction; xvfb
          # gives it one inside the manylinux container.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: 'pytest -x {package}/tests'
          CIBW_TEST_COMMAND_LINUX: 'xvfb-run -a pytest -x {package}/tests'

      - name: Upload wheels artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist --outdir sdist bindings/python
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: sdist/*.tar.gz

  publish_testpypi:
    name: Publish to TestPyPI (dry run)
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # TestPyPI is the dry-run path — only on manual dispatch with the
    # matching choice. Use this to validate the publish flow before tagging.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/affineui
    permissions:
      id-token: write  # OIDC for Trusted Publisher
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'wheels-*'
          merge-multiple: true
      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish_pypi:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Tags `v*` always publish to live PyPI. Manual dispatch publishes only
    # when the user explicitly picks `pypi` (default is `none` for build-
    # only smoke runs).
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/p/affineui
    permissions:
      id-token: write  # OIDC for Trusted Publisher
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'wheels-*'
          merge-multiple: true
      - name: Download sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
