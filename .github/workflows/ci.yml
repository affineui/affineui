name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job here compiles and RUNS repository code (ctest, the examples, the
# bindings), including from pull_request events. None of it needs to write
# anything back, so drop the token to read-only rather than leaving the
# permissive default in place.
permissions:
  contents: read

jobs:
  windows:
    name: Windows (D3D11)
    # Pinned to windows-2022 because windows-latest is being redirected to
    # windows-2025-vs2026 (June 2026 migration), which drops the VS 17 2022
    # generator the msvc preset asks for. Move to windows-latest once the
    # preset updates to VS 18 2026 (or switches to Ninja + vcvarsall).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Visual Studio generator => self-contained, no vcvars/Ninja setup needed.
      # The msvc preset resolves the backend to d3d11 on Windows.
      - name: Configure
        run: cmake --preset msvc
      - name: Build
        run: cmake --build build/msvc --config RelWithDebInfo --parallel
      - name: Test
        run: ctest --test-dir build/msvc -C RelWithDebInfo --output-on-failure

  linux:
    name: Linux (GL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install X11 / GL / ALSA dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev
      # Backend auto-resolves to gl on Linux. external/ is vendored (committed),
      # so no dependency fetch step is needed.
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS (Metal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Ninja
        run: brew install ninja
      # Backend auto-resolves to metal on Apple now that nanovg_sokol.h
      # ships MSL shaders. external/ is vendored, no fetch needed.
      - name: Configure
        run: cmake --preset release
      - name: Build
        run: cmake --build build/release --parallel
      - name: Test
        run: ctest --test-dir build/release --output-on-failure

  amalgamate:
    name: Amalgamation (compile two-file SDK)
    runs-on: macos-latest
    needs: macos
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Ninja
        run: brew install ninja
      - name: Configure + generate amalgamation
        run: |
          cmake --preset release
          cmake --build build/release --target amalgamate

      # The steps below compile the FRESHLY generated SDK in build/release/dist.
      # But that is not what ships — consumers get the COMMITTED dist/, and until
      # now nothing ever compared the two. So a stale dist/ passed CI every time:
      # CI validated an artifact nobody uses while the shipped one drifted.
      #
      # It drifted four times in one release cycle (#80 "regenerate the stale
      # dist/ SDK", #82 "regenerate dist/ with the IME fix, before tagging", #95
      # after the org rename, and again after the Painter vtable fix in #103) —
      # every one caught by hand, twice mid-release. dist/ IS the deliverable for
      # two-file SDK users; shipping one that doesn't match its source is exactly
      # the class of bug a release gate exists to stop.
      #
      # Costs nothing: the generated copy is already sitting there.
      - name: Committed dist/ must match a fresh regeneration
        run: |
          set -euo pipefail
          stale=0
          for f in affineui.h affineui.cpp; do
            if ! cmp -s "build/release/dist/$f" "dist/$f"; then
              echo "::error file=dist/$f::dist/$f is STALE — it does not match a regeneration from the current source."
              stale=1
            fi
          done
          if [ "$stale" -ne 0 ]; then
            echo ""
            echo "The committed two-file SDK is out of date. Regenerate and commit it:"
            echo "    ./build.sh codefiles"
            exit 1
          fi
          echo "dist/ matches a fresh regeneration."

      - name: Compile amalgamation (Metal default)
        run: |
          clang++ -std=c++20 -x objective-c++ \
            -DSOKOL_METAL -DSOKOL_NO_ENTRY -DAFFINEUI_BACKEND_METAL \
            -I build/release/dist \
            -c build/release/dist/affineui.cpp -o /tmp/amalg_metal.o
      - name: Compile amalgamation (GL default)
        run: |
          clang++ -std=c++20 -x objective-c++ \
            -DSOKOL_GLCORE -DSOKOL_NO_ENTRY -DAFFINEUI_BACKEND_GL \
            -I build/release/dist \
            -c build/release/dist/affineui.cpp -o /tmp/amalg_gl.o
      - name: Compile amalgamation (adapter, AFFINEUI_WITH_SOKOL)
        run: |
          clang++ -std=c++20 -x objective-c++ \
            -DSOKOL_METAL -DSOKOL_NO_ENTRY -DAFFINEUI_BACKEND_METAL -DAFFINEUI_WITH_SOKOL \
            -I build/release/dist \
            -c build/release/dist/affineui.cpp -o /tmp/amalg_metal_adapter.o

  amalgamate_gcc:
    name: Amalgamation (gcc consumes the two-file SDK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Generating needs clang (amalgamate.py compiles the staged Lexbor tree
      # to repair it and to scan objects for unprefixed globals, with
      # clang-only flags). CONSUMING must work on gcc too — and until this job
      # existed, nothing ever compiled the amalgamation with anything but
      # clang-on-macOS, so gcc-only breakage (e.g. Lexbor's C99 designated
      # initializers, which C++ rejects) shipped silently.
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang \
            libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev
      - name: Configure + generate amalgamation
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target amalgamate
      - name: Compile amalgamation with g++ (GL)
        run: |
          g++ -std=c++20 \
            -DSOKOL_GLCORE -DSOKOL_NO_ENTRY -DAFFINEUI_BACKEND_GL \
            -I build/dist -c build/dist/affineui.cpp -o /tmp/amalg_gcc.o
      - name: Compile amalgamation with g++ (adapter, AFFINEUI_WITH_SOKOL)
        run: |
          g++ -std=c++20 \
            -DSOKOL_GLCORE -DSOKOL_NO_ENTRY -DAFFINEUI_BACKEND_GL -DAFFINEUI_WITH_SOKOL \
            -I build/dist -c build/dist/affineui.cpp -o /tmp/amalg_gcc_adapter.o

  bindings:
    name: Bindings (Python / Rust / C#)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install X11 / GL / ALSA dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build xvfb \
            libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev

      # affineui_c is the C ABI shared library that BOTH the Rust and C#
      # bindings link against. No other CI job builds it (they all leave
      # AFFINEUI_BUILD_C_SHARED at its OFF default), so until this job existed
      # a change could break the ABI contract and every check stayed green.
      - name: Build affineui_c (the shared C ABI)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DAFFINEUI_BUILD_C_SHARED=ON
          cmake --build build --target affineui_c --parallel

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Python builds its own extension (scikit-build-core compiles the core
      # in-tree), so it doesn't consume affineui_c. Constructing ui.App() opens
      # an X connection even headless, hence xvfb.
      - name: Python — build + pytest
        run: |
          pip install pytest
          pip install -e ./bindings/python
          xvfb-run -a python -m pytest bindings/python/tests -q

      # `system` links the affineui_c built above instead of re-running cmake
      # through build.rs — but build.rs only takes that path when `vendored` is
      # OFF (it's a default feature), so --no-default-features is required or
      # this silently rebuilds the whole C++ core again.
      # --test-threads=1: the bindings hold process-global state, so the suite
      # is not parallel-safe.
      - name: Rust — cargo test
        working-directory: bindings/rust
        env:
          AFFINEUI_LIB_DIR: ${{ github.workspace }}/build
        run: |
          xvfb-run -a cargo test --no-default-features --features system \
            -- --test-threads=1

      # There is no C# test project yet; Hello --headless IS the assertion —
      # it returns 1 if the headless layout produces no content, and checks
      # that every callback holder is released on view dispose.
      - name: C# — build + Hello --headless
        env:
          AFFINEUI_NATIVE_DIR: ${{ github.workspace }}/build
        run: |
          xvfb-run -a dotnet run --project bindings/csharp/examples/Hello \
            -c Release -- --headless

  examples:
    name: Examples (build every sample)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install X11 / GL / ALSA dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev
      # No CI job built the examples before this one, so a sample could break
      # (or stop compiling entirely) without a single check going red. Building
      # them is cheap; running them mostly is not — only the two that support a
      # headless dump are exercised below.
      - name: Configure + build all examples
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      # The only two samples with a non-interactive path. DENDER dumps the view
      # diagnostics to stderr: a non-empty diagnostics block means the view tree
      # failed to build, so an empty stderr is a real assertion, not a smoke test.
      - name: Headless samples (DENDER + game editor)
        run: |
          set -euo pipefail
          AFFINEUI_DUMP_HTML=1 ./build/examples/decius_dender/decius_dender \
            > /tmp/dender.html 2> /tmp/dender.err
          test -s /tmp/dender.html
          if [ -s /tmp/dender.err ]; then
            echo "DENDER reported view diagnostics:"; cat /tmp/dender.err; exit 1
          fi
          ./build/examples/decius_dender/decius_dender --probe
          AFFINEUI_DUMP_HTML=1 ./build/examples/decius_game_editor/decius_game_editor \
            > /tmp/ge.html
          test -s /tmp/ge.html

  rust_windows:
    name: Rust consumer (Windows, debug + release)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable

      # No CI job has ever run cargo on Windows: the `bindings` job runs on
      # ubuntu, and the `windows` job only compiles C++ / runs ctest. So the
      # one combination that breaks — Windows AND the dev profile — was the
      # one combination nothing covered, and 0.4.1 shipped a crate whose
      # DEFAULT `cargo build` could not link:
      #
      #     unresolved external symbol __imp__calloc_dbg
      #     LNK4098: defaultlib 'MSVCRTD' conflicts with use of other libs
      #
      # build.rs compiles the C++ core Release (release CRT), while cargo's
      # dev profile links the DEBUG CRT — and the debug allocator symbols
      # (_malloc_dbg, _CrtDbgReport, …) don't exist in the release CRT. 0.4.0
      # masked it by shipping a DLL, which seals its CRT inside itself; linking
      # the archive statically made the two CRTs meet in the consumer's link.
      #
      # Build a real downstream consumer, both profiles. Debug is listed first
      # because it is the one that was broken, and it is what `cargo build`
      # does by default.
      - name: Build a downstream consumer (debug — the profile that broke)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/consumer/src
          cd /tmp/consumer

          # $GITHUB_WORKSPACE is a Windows path (D:\a\affineui\affineui). In a
          # TOML basic string (double quotes) the backslashes are escape
          # sequences — `\a` is not a valid one, so Cargo.toml fails to parse.
          # Normalise to forward slashes (which cargo accepts on Windows) and
          # emit a TOML *literal* string (single quotes), which does no escape
          # processing at all.
          ws=$(printf '%s' "$GITHUB_WORKSPACE" | tr '\\' '/')

          cat > Cargo.toml <<EOF
          [package]
          name = "consumer"
          version = "0.0.0"
          edition = "2021"

          [dependencies]
          affineui = { path = '${ws}/bindings/rust/affineui' }
          EOF
          cat Cargo.toml

          cat > src/main.rs <<'EOF'
          fn main() {
              println!("affineui {}", affineui::version());
          }
          EOF
          cargo build
          ./target/debug/consumer.exe

      - name: Build a downstream consumer (release)
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/consumer
          cargo build --release
          ./target/release/consumer.exe

  version_stamp:
    name: Release rules + version stamping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # scripts/resolve_release.py decides what gets published to three
      # IMMUTABLE registries — a wrong answer cannot be taken back. It is the
      # only thing in the release path that reasons about versions, so it gets
      # tested like anything else that can't be undone: every rule, including
      # the one the whole model rests on (a release tags the RC's commit, even
      # when main has moved on). See docs/RELEASING.md.
      - name: Release rules
        run: python3 scripts/test_release_rules.py

      # scripts/set_version.py rewrites the version in five manifests, and the
      # release workflows run it to stamp a tag's version before publishing.
      # It matches each file with an anchored regex and exits non-zero the moment
      # one stops matching — so a routine edit to any of those lines silently
      # breaks the release, and nothing notices until a tag is pushed and every
      # publish job dies. That is exactly what happened: a `default-features` key
      # was added to the affineui-sys dependency line, and the stamper had been
      # aborting partway through — leaving the C# and CMake versions unstamped —
      # ever since. Run it for real against a throwaway version and assert that
      # every manifest actually took it.
      - name: Stamp a scratch version and verify every manifest took it
        run: |
          set -euo pipefail
          python3 scripts/set_version.py 9.9.9-rc.1

          fail=0
          check() {  # file, expected-substring
            if grep -qF -- "$2" "$1"; then
              echo "ok    $1"
            else
              echo "FAIL  $1 — expected to contain: $2"
              fail=1
            fi
          }
          check bindings/python/pyproject.toml            'version = "9.9.9-rc.1"'
          check bindings/rust/Cargo.toml                  'version = "9.9.9-rc.1"'
          check bindings/rust/affineui/Cargo.toml         'version = "9.9.9-rc.1"'
          check bindings/csharp/AffineUI/AffineUI.csproj  '<Version>9.9.9-rc.1</Version>'
          check CMakeLists.txt                            'VERSION 9.9.9'

          # The affineui-sys dependency line also carries `default-features = false`,
          # which gates the vendored/system features. A careless rewrite drops it.
          check bindings/rust/affineui/Cargo.toml 'default-features = false'

          exit "$fail"

      # Stamping the manifests is necessary but not sufficient: a version can
      # still be baked in from a source the stamper never touches, and the
      # check above — which only looks at files set_version.py writes — is
      # blind to exactly that. It happened. `affineui.__version__` was compiled
      # from `project(affineui_python VERSION ...)` in bindings/python/
      # CMakeLists.txt, a second source of truth nothing stamps, so 0.4.0
      # shipped to PyPI reporting `__version__ == "0.0.1"` while pip metadata
      # and version() were both correct.
      #
      # So assert what a user actually observes: build the wheel from the
      # stamped tree, install it, and require all three to agree.
      - name: Install X11 / GL / ALSA dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev

      - name: Build the wheel and check the version a user sees
        run: |
          set -euo pipefail
          # The tree is still stamped to 9.9.9-rc.1 from the step above.
          python3 -m venv /tmp/v
          . /tmp/v/bin/activate
          pip install --upgrade pip
          pip install ./bindings/python

          python3 - <<'PY'
          import importlib.metadata as md
          import sys
          import affineui as ui

          # pip NORMALIZES to PEP 440: the stamped "9.9.9-rc.1" installs as
          # "9.9.9rc1". __version__ is read from that same metadata, so the two
          # agree by construction. version() reports the native CORE version,
          # which carries no pre-release component (a CMake project(VERSION)
          # literal cannot hold one) — hence the prefix check below.
          expected = "9.9.9rc1"
          seen = {
              "__version__":  ui.__version__,
              "version()":    ui.version(),
              "pip metadata": md.version("affineui"),
          }
          for k, v in seen.items():
              print(f"  {k:<13} = {v}")

          # version() reports the core MAJOR.MINOR.PATCH (CMake project()
          # cannot carry a pre-release suffix), so compare it on that basis.
          bad = []
          if seen["__version__"] != expected:
              bad.append("__version__")
              print(f"FAIL __version__ is {seen['__version__']!r}, expected {expected!r}")
          if md.version("affineui") != expected:
              bad.append("pip metadata")
              print(f"FAIL pip metadata is {md.version('affineui')!r}, expected {expected!r}")
          if not seen["version()"].startswith("9.9.9"):
              bad.append("version()")
              print(f"FAIL version() is {seen['version()']!r}, expected to start with '9.9.9'")

          if bad:
              sys.exit(f"version mismatch in: {', '.join(bad)}")
          print("  all three agree")
          PY
