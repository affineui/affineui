[package]
name = "affineui"
description = "Safe, idiomatic Rust bindings for AffineUI — GPU-accelerated HTML/CSS UI for tools and engines. EXPERIMENTAL preview; APIs will change."
readme = "README.md"
keywords = ["gui", "ui", "html", "css", "imgui"]
categories = ["gui", "api-bindings"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["vendored"]
vendored = ["affineui-sys/vendored"]
system = ["affineui-sys/system"]

[dependencies]
affineui-sys = { path = "../affineui-sys", version = "0.0.3", default-features = false }

[lib]
doctest = false
