<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../_decius/css/decius.bundle.min.css">
<style>body{margin:0;background:#14161c;padding:18px}.fixture{width:420px}</style>
</head>
<body class="dcs" data-dcs-density="comfortable">
  <section class="fixture dcs-panel dcs-panel--bordered">
    <div class="dcs-panel__body">
      <div class="dcs-props">
        <div class="dcs-field">
          <span class="dcs-field__label">Location</span>
          <div class="dcs-vec">
            <div data-dcs-combo data-label="X" data-value="0" data-step="0.01" data-suffix=" m"></div>
            <div data-dcs-combo data-label="Y" data-value="0" data-step="0.01" data-suffix=" m"></div>
            <div data-dcs-combo data-label="Z" data-value="0" data-step="0.01" data-suffix=" m"></div>
          </div>
        </div>
        <div class="dcs-field">
          <span class="dcs-field__label">Dimensions</span>
          <div class="dcs-vec">
            <div data-dcs-combo data-label="X" data-value="2" data-step="0.01" data-suffix=" m"></div>
            <div data-dcs-combo data-label="Y" data-value="2" data-step="0.01" data-suffix=" m"></div>
            <div data-dcs-combo data-label="Z" data-value="2" data-step="0.01" data-suffix=" m"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
