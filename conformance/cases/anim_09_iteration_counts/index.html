<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #ffffff; }
  .stage { position: relative; width: 520px; height: 230px; background: #f8f9fa; }
  .row { position: relative; height: 62px; margin-left: 44px; width: 420px; }
  .rail { position: absolute; left: 0; top: 28px; width: 330px; height: 8px; background: #d3d9df; }
  .target {
    position: absolute; left: 0; top: 10px; width: 56px; height: 44px;
    background: #0d6efd;
    animation-name: iter_move;
    animation-duration: 800ms;
    animation-timing-function: linear;
    animation-fill-mode: both;
  }
  .once .target { animation-iteration-count: 1; background: #0d6efd; }
  .twice .target { animation-iteration-count: 2; background: #198754; }
  .infinite .target { animation-iteration-count: infinite; background: #dc3545; }
  @keyframes iter_move {
    from { transform: translateX(0); opacity: .45; }
    to   { transform: translateX(250px); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="row once"><div class="rail"></div><div class="target"></div></div>
    <div class="row twice"><div class="rail"></div><div class="target"></div></div>
    <div class="row infinite"><div class="rail"></div><div class="target"></div></div>
  </div>
</body>
</html>
