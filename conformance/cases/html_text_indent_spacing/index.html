<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #fff; }
  .wrap { padding: 20px; }
  p { font-size: 16px; line-height: 1.4; margin: 0 0 10px; font-family: sans-serif; color: #212121; }
  .red { color: red; }
  .ind { text-indent: 48px; }
</style>
</head>
<body>
  <div class="wrap">
    <p>Black text, no indent.</p>
    <p class="red">Red text, no indent.</p>
    <p class="ind">Black text, indented 48px.</p>
    <p class="red ind">Red text, indented 48px.</p>
  </div>
</body>
</html>
