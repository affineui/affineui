<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../_decius/css/decius.bundle.min.css">
<style>
body{margin:0;background:#14161c;padding:18px}
.fixture{width:360px}
.row{display:flex;align-items:center;gap:28px;padding:18px 8px 14px}
</style>
</head>
<body class="dcs" data-dcs-density="comfortable" data-dcs-style="3d">
  <section class="fixture dcs-panel dcs-panel--bordered">
    <div class="dcs-panel__header">
      <div class="dcs-panel__title"><i class="di di-oscillator"></i><span>3D Knobs</span></div>
    </div>
    <div class="dcs-panel__body row">
      <div data-dcs-knob data-min="0" data-max="100" data-value="32" data-label="Cut"></div>
      <div data-dcs-knob data-min="-1" data-max="1" data-value="0" data-bipolar data-label="Pan"></div>
      <div data-dcs-knob data-min="0" data-max="1" data-value="0.63" data-label="Drive"></div>
    </div>
  </section>
</body>
</html>
