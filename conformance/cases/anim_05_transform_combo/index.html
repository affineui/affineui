<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #ffffff; }
  .stage { position: relative; width: 460px; height: 260px; background: #f8f9fa; }
  .target {
    position: absolute; left: 80px; top: 98px; width: 110px; height: 52px;
    background: #fd7e14;
    animation-name: combo_motion;
    animation-duration: 1000ms;
    animation-timing-function: linear;
    animation-iteration-count: 1;
    animation-fill-mode: both;
  }
  .target .mark { width: 34px; height: 52px; background: #0dcaf0; }
  @keyframes combo_motion {
    0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: .55; }
    50%  { transform: translate(105px, 28px) scale(1.25) rotate(45deg); opacity: .85; }
    100% { transform: translate(210px, -16px) scale(.75) rotate(90deg); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="target"><div class="mark"></div></div>
  </div>
</body>
</html>
