<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #fff; font-family: sans-serif; color: #212121; }
  .wrap { padding: 16px; max-width: 580px; }
  /* Zero margins on headings to avoid margin-collapse differences */
  h1,h2,h3,h4,h5,h6 { margin: 0; line-height: 1.2; }
  h1 { font-size: 2em; }
  h2 { font-size: 1.5em; }
  h3 { font-size: 1.17em; }
  h4 { font-size: 1em; }
  h5 { font-size: .83em; }
  h6 { font-size: .67em; }
  p  { font-size: 16px; line-height: 1.5; margin: 8px 0; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Heading One</h1>
    <h2>Heading Two</h2>
    <h3>Heading Three</h3>
    <h4>Heading Four</h4>
    <h5>Heading Five</h5>
    <h6>Heading Six</h6>
    <p>A plain paragraph that wraps across multiple lines to show correct
       line-height and paragraph spacing after the heading scale.</p>
  </div>
</body>
</html>
