<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #ffffff; }
  .stage { position: relative; width: 480px; height: 230px; background: #f8f9fa; }
  .row { position: relative; height: 58px; margin-left: 42px; width: 380px; }
  .rail { position: absolute; left: 0; top: 27px; width: 300px; height: 8px; background: #d3d9df; }
  .target {
    position: absolute; left: 0; top: 10px; width: 54px; height: 42px;
    background: #0d6efd;
    animation-name: paused_move;
    animation-duration: 1000ms;
    animation-timing-function: linear;
    animation-iteration-count: 1;
    animation-fill-mode: both;
    animation-play-state: paused;
  }
  .p0 .target { animation-delay: 0ms; background: #0d6efd; }
  .p250 .target { animation-delay: -250ms; background: #198754; }
  .p500 .target { animation-delay: -500ms; background: #dc3545; }
  .p1000 .target { animation-delay: -1000ms; background: #6f42c1; }
  @keyframes paused_move {
    from { transform: translateX(0); opacity: .3; }
    to   { transform: translateX(230px); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="row p0"><div class="rail"></div><div class="target"></div></div>
    <div class="row p250"><div class="rail"></div><div class="target"></div></div>
    <div class="row p500"><div class="rail"></div><div class="target"></div></div>
    <div class="row p1000"><div class="rail"></div><div class="target"></div></div>
  </div>
</body>
</html>
